[project]
name = "perfcheck"
version = "0.1.0"
description = "Reproducible performance-regression evidence for CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncer>=0.0.8",
    "httpx2[brotli,http2,zstd]>=2.13.1",
    "numpy>=2.4",
    "pydantic>=2.12",
    "rich>=14.0",
    "scipy>=1.18",
    "typer>=0.21",
]

[project.scripts]
perfcheck = "perfcheck.cli:app"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "pytest>=9.0",
    "ruff>=0.14",
]
examples = [
    "marimo>=0.24,<0.25",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["src", "tests", "examples"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "FBT001", "FBT002", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["perfcheck.model_types.StrictModel"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
