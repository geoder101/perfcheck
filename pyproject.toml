[project]
name = "perfcheck"
version = "0.1.0"
description = "Reproducible performance-regression evidence for CI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncer>=0.0.8",
    "httpx2[brotli,http2,zstd]>=2.13.1",
    "numpy>=2.4",
    "pydantic>=2.12",
    "rich>=14.0",
    "scipy>=1.18",
    "typer>=0.21",
]

[project.scripts]
perfcheck = "perfcheck.cli:app"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "coverage[toml]>=7.17,<8",
    "pytest>=9.0",
    "pytest-cov>=7.1,<8",
    "ruff>=0.14",
]
examples = [
    "marimo>=0.24,<0.25",
]
docs = [
    "furo==2025.12.19",
    "sphinx==9.1.1",
    "sphinx-autoapi==3.8.1",
    "sphinxcontrib-mermaid==2.1.1",
]
mutation = [
    "mutmut==3.8.0; sys_platform != 'win32'",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.14"
pythonPlatform = "All"
include = ["src", "tests", "examples", "tools"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "FBT001", "FBT002", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = ["INP001"]
"tests/**/*.py" = ["D", "PLR2004", "S101"]
"examples/01-overview.py" = ["N999"]
"examples/02-collect.py" = ["N999"]
"examples/03-summarize.py" = ["N999"]
"examples/04-compare.py" = ["N999"]
"examples/05-failures-and-ci.py" = ["N999"]
"examples/06-statistical-foundations.py" = ["N999"]
"examples/07-summary-and-eligibility.py" = ["N999"]
"examples/08-bootstrap-and-decisions.py" = ["N999"]
# Lesson 09 deliberately teaches seeded, non-cryptographic resampling.
"examples/09-plain-python-mechanics.py" = ["N999", "S311"]
"examples/10-comparative-methods.py" = ["N999"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["perfcheck.model_types.StrictModel"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/perfcheck"]
patch = ["subprocess"]

[tool.coverage.report]
exclude_also = [
    '(?m:^[ \t]*case _:[ \t]*\r?\n[ \t]+assert_never\()',
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.json]
output = "coverage/coverage.json"

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/perfcheck/regression_aggregation.py"]
pytest_add_cli_args_test_selection = ["tests/test_suite_aggregation.py"]
pytest_add_cli_args = ["-p", "no:pytest_cov", "-p", "tools.mutation_probe"]
also_copy = ["tools/"]
max_stack_depth = -1
mutate_only_covered_lines = false
do_not_mutate_patterns = ['^[ \t]*assert_never\(']
type_check_command = []
timeout_constant = 1
timeout_multiplier = 15
debug = true
