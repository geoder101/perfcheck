# Composite action: set up the pinned CI toolchain (setup-uv + setup-just).
#
# Checkout stays inline in each job because the event SHA, credential scope, and
# any post-checkout verification differ per workflow (the pages build checks out
# an authorized SHA, the mutation pilot verifies a clean event SHA). Calling this
# action after checkout installs uv and just so they stay on PATH for the caller's
# `run:` steps, and declares the pinned toolchain in one place to bump in one step.
name: Set up CI toolchain
description: Install the pinned uv and just CI toolchain on top of the checkout.

inputs:
  python-version:
    description: Python version to install via setup-uv.
    required: false
    default: "3.14"
  enable-cache:
    description: Whether setup-uv should enable the uv dependency cache.
    required: false
    default: "true"
  just-version:
    description: Just version to install; leave empty to skip this step.
    required: false
    default: "1.58.0"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
    - name: Set up just
      if: ${{ inputs.just-version != '' }}
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: ${{ inputs.just-version }}
