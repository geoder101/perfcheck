# Composite action: set up the pinned CI toolchain (setup-uv + setup-just).
#
# Shared by ci.yml, pages.yml, and release.yml so the pinned toolchain is
# declared in one place and bumped in one step. Used inline with
# `uses: ./.github/actions/setup` so the installed `uv` and `just` stay on PATH
# for the caller's `run:` steps. Each consumer performs its OWN inline checkout
# before calling this.
name: Set up toolchain
description: Install the pinned uv and just CI toolchain on top of each consumer's inline checkout.

inputs:
  python-version:
    description: Python version to install via setup-uv.
    required: false
    default: "3.14"
  just-version:
    description: Just version to install; leave empty to skip this step.
    required: false
    default: "1.59.0"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - name: Set up just
      if: ${{ inputs.just-version != '' }}
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      with:
        just-version: ${{ inputs.just-version }}
