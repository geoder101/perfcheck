name: Manual advisory mutation pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          checkout_status=$(git status --porcelain)
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$checkout_status"
          test ! -e mutation
          test ! -L mutation
          test ! -e "$RUNNER_TEMP/mutation-ci"
          test ! -L "$RUNNER_TEMP/mutation-ci"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: false
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples --group mutation
      - name: Record mutation invocation identity
        run: uv run --locked --no-sync python -m tools.mutation_summary prepare
      - name: Bounded single-worker advisory pilot
        id: pilot
        run: |
          set -o pipefail
          just mutation 2>&1 | tee "$RUNNER_TEMP/mutation-ci/stdout.log"
      - name: Validate evidence and summarize
        id: evidence
        if: always()
        env:
          MUTATION_OUTCOME: ${{ steps.pilot.outcome }}
        run: |
          if ! uv run --locked --no-sync python -m tools.mutation_summary export; then
            printf '\nMutation evidence invalid, incomplete or unavailable; this is not a passing experiment.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain approved mutation evidence
        if: always() && steps.evidence.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mutation-ci/evidence/
          retention-days: 7
          if-no-files-found: error
