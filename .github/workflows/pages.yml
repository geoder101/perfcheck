name: Documentation Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authorize default-branch push
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$EVENT_NAME" = push
          test "$EVENT_REF" = refs/heads/main
          test "$DEFAULT_BRANCH" = main

  ci-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scan.outputs.scope }}
      render: ${{ steps.scan.outputs.render }}
      full_gate: ${{ steps.scan.outputs.full_gate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Determine change scope
        id: scan
        shell: bash
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BEFORE=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$BEFORE" ] || ! git rev-parse --verify -q "$BEFORE" >/dev/null 2>&1; then
            BEFORE=4b825dc642cb6eb9a060e54bf8d69288fbee4904   # git empty-tree SHA; robust vs root commit
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | uv run --no-sync python -m tools.ci_git_diff_scope > "$GITHUB_OUTPUT"

  build:
    needs: [authorize, ci-scan]
    outputs:
      render: ${{ needs.ci-scan.outputs.render }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        uses: ./.github/actions/setup
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        run: just sync
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        uses: ./.github/actions/provision-docs-render
      - name: Build the docs site
        if: ${{ needs.ci-scan.outputs.render == 'true' }}
        run: |
          rm -rf docs/_build
          just docs-check
          uv run --no-sync python -m tools.pages_authorization
      - if: ${{ needs.ci-scan.outputs.render == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: docs/_build/html

  deploy:
    needs: [authorize, build]
    if: ${{ needs.build.outputs.render == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the docs site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
