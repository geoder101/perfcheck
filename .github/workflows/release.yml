name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - run: just build
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(uv run --no-sync python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          TAG="v${VERSION}"
          # An existing version is immutable: never move its tag or replace assets.
          if gh release view "$TAG" 2>/dev/null; then
            gh release view "$TAG" --json url --jq .url
            exit 0
          fi
          # Refuse to repurpose an existing tag, including one from another commit.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a release; inspect it before retrying."
            exit 1
          fi
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --target "$GITHUB_SHA" --title "perfcheck $VERSION" --generate-notes
