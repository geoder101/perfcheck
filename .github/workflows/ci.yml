name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - uses: ./.github/actions/provision-docs-render
      - run: just check

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: just sync
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
      - uses: ./.github/actions/provision-docs-render
      - name: Prepare coverage evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python -m tools.quality_evidence prepare
      - name: Run the coverage gate
        id: gate
        run: just coverage-check
      - name: Export coverage evidence
        id: evidence
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if ! uv run python -m tools.quality_evidence export --outcome "$GATE_OUTCOME"; then
            printf '\nCoverage export failed or gate did not pass; unavailable reports are not a passing measurement.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain coverage evidence
        if: always() && steps.evidence.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/evidence/html/
            coverage/evidence/coverage.json
            coverage/evidence/.coverage
            coverage/evidence/provenance.json
            coverage/evidence/start.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
