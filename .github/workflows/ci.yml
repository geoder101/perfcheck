name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Provision locked Mermaid and Chrome
        run: |
          npm ci --prefix tools/docs --ignore-scripts
          node tools/docs/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Provision Linux TeX and browser prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra dvisvgm fonts-liberation fonts-dejavu-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          sudo install -m 644 tools/docs/chrome-apparmor /etc/apparmor.d/perfcheck-chrome
          sudo apparmor_parser -r /etc/apparmor.d/perfcheck-chrome
          latex --version
          dvisvgm --version
      - name: Provision macOS TeX
        if: runner.os == 'macOS'
        run: |
          brew install --cask basictex
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install amsmath amsfonts preview dvisvgm dvipng cm-super
          /Library/TeX/texbin/latex --version
          /Library/TeX/texbin/dvisvgm --version
      - name: Provision Windows TeX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install miktex --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = 'C:\Program Files\MiKTeX\miktex\bin\x64'
          $env:PATH = "$bin;$env:PATH"
          $bin >> $env:GITHUB_PATH
          miktex --admin packages update-package-database
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          miktex --admin packages install amsmath amsfonts preview miktex-dvisvgm-bin-x64-2.9 cm-super
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          initexmf --admin --update-fndb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          miktex --admin links install --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          latex --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dvisvgm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: just check

  coverage:
    name: Fresh combined coverage evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Provision locked Mermaid and Chrome
        run: |
          npm ci --prefix tools/docs --ignore-scripts
          node tools/docs/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Provision Linux TeX and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra dvisvgm fonts-liberation fonts-dejavu-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          sudo install -m 644 tools/docs/chrome-apparmor /etc/apparmor.d/perfcheck-chrome
          sudo apparmor_parser -r /etc/apparmor.d/perfcheck-chrome
          latex --version
          dvisvgm --version
      - name: Start coverage invocation
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python -m tools.quality_evidence prepare
      - name: Fixed fresh coverage gate
        id: gate
        run: just coverage-check
      - name: Export coverage evidence and summary
        id: evidence
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if ! uv run python -m tools.quality_evidence export --outcome "$GATE_OUTCOME"; then
            printf '\nCoverage export failed or gate did not pass; unavailable reports are not a passing measurement.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain coverage evidence
        if: always() && steps.evidence.outputs.publish == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/evidence/html/
            coverage/evidence/coverage.json
            coverage/evidence/.coverage
            coverage/evidence/provenance.json
            coverage/evidence/start.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
