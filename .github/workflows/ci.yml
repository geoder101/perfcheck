name: CI

on:
  pull_request:
  push:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Fast gate (Linux)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples
      - run: just fast-check

  docs:
    name: Full check on default branch
    # Runs only when something reaches the default branch (a merge, direct push,
    # or manual dispatch from the default branch); skipped on PRs and schedules.
    if: github.event_name != 'schedule' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Provision locked Mermaid and Chrome
        run: |
          npm ci --prefix tools/docs --ignore-scripts
          node tools/docs/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Provision Linux TeX and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra dvisvgm fonts-liberation fonts-dejavu-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          sudo install -m 644 tools/docs/chrome-apparmor /etc/apparmor.d/perfcheck-chrome
          sudo apparmor_parser -r /etc/apparmor.d/perfcheck-chrome
          latex --version
          dvisvgm --version
      - run: just check

  coverage:
    name: Fresh combined coverage evidence
    # Nightly sweep plus manual dispatch; never runs on PR/push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - run: uv sync --locked --group dev --group docs --group examples
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false
      - name: Provision locked Mermaid and Chrome
        run: |
          npm ci --prefix tools/docs --ignore-scripts
          node tools/docs/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome
      - name: Provision Linux TeX and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra dvisvgm fonts-liberation fonts-dejavu-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1
          sudo install -m 644 tools/docs/chrome-apparmor /etc/apparmor.d/perfcheck-chrome
          sudo apparmor_parser -r /etc/apparmor.d/perfcheck-chrome
          latex --version
          dvisvgm --version
      - name: Start coverage invocation
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python -m tools.quality_evidence prepare
      - name: Fixed fresh coverage gate
        id: gate
        run: just coverage-check
      - name: Export coverage evidence and summary
        id: evidence
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if ! uv run python -m tools.quality_evidence export --outcome "$GATE_OUTCOME"; then
            printf '\nCoverage export failed or gate did not pass; unavailable reports are not a passing measurement.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Retain coverage evidence
        if: always() && steps.evidence.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/evidence/html/
            coverage/evidence/coverage.json
            coverage/evidence/.coverage
            coverage/evidence/provenance.json
            coverage/evidence/start.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
